<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcForge Display</title>
  <link rel="stylesheet" href="./css/display.css">
</head>
<body>
  <div id="display-status" class="status disconnected">Connecting...</div>
  <div id="map-info-banner" class="map-info-banner">
    <div id="map-name-header" class="map-name-header">No Map Loaded</div>
    <div id="current-turn-banner" class="current-turn-banner" style="display: none;">
      <span class="turn-label">Current Turn:</span>
      <span id="current-turn-name" class="turn-name">&amp;mdash;</span>
    </div>
  </div>
  <div id="root">
    <canvas id="display-canvas" width="1920" height="1080">Your browser does not support the canvas element.</canvas>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="./js/display.js"></script>
</body>
</html>
